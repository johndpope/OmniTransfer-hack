  enable_rcl: true
  enable_tma: false
  enable_tpb: true
  i2v_mode: false
  log_reconstructions: true
  log_video_comparisons: true
  name: omnitransfer
  num_frames_to_visualize: 1
  perceptual_loss_interval: 5
  reconstruction_log_interval: 100
  reference_latents_dir: reference_latents
  style_loss_weight: 0.1
  task_type: style_transfer
  training_stage: 1
  use_decoded_pixels_for_style: true
  use_vgg_style_features: true
  video_log_interval: 500
validation:
  interval: null
wandb:
  enabled: true
  log_validation_videos: false
  project: omnitransfer-mashup-style
