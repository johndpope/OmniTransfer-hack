# SCD Evolution V3.1 — Stronger ES signal (more pairs + higher noise)
#
# V3 (CFG) ran 27 gens with fitness_diff ~0.05 — too weak for convergence.
# Root cause: noise_scale=0.005 on 71M params → per-param perturbation ≈ 6e-7.
#
# V3.1 changes:
#   - population_size: 8 → 16 (better gradient estimate, 2× more pairs)
#   - eval_batch_size: 4 → 6 (lower variance per perturbation)
#   - noise_scale: 0.005 → 0.02 (4× stronger perturbations → bigger fitness diffs)
#   - update_scale: 0.002 → 0.003 (slightly larger ES steps)
#
# Forward passes per generation (GPU-batched):
#   16 pairs × 2 antithetic × 6 samples × 3 frames × 8 steps × 2 CFG = 9216
#   Batched to: 16×2 × 3×8 = 768 decoder calls (batch=12 each)
#   Estimated: ~250s/gen (~4.2 min)
#
# Usage:
#   python scripts/evolve_scd.py \
#     --config configs/ltx2_scd_evolution_cfg.yaml \
#     --lora-path /media/2TB/omnitransfer/output/scd_evolution_distilled/checkpoints/lora_evolved_gen_0125.safetensors

model:
  checkpoint: "/media/2TB/ltx-models/ltx2/ltx-2-19b-distilled.safetensors"
  lora_path: null  # Set via CLI
  encoder_layers: 32
  decoder_combine: "add"
  quantization: "int8-quanto"
  distilled: true

data:
  root: "/media/2TB/omnitransfer/data/evolution_merged"
  conditions_dir: "conditions_final"

warmup:
  steps: 200               # Backprop warmup: per-frame FM loss on decoder LoRA
  lr: 1.0e-4               # AdamW learning rate for warmup

evolution:
  population_size: 16      # 16 antithetic pairs (2× more for better ES gradient)
  num_generations: 300
  noise_scale: 0.02        # 4× stronger perturbations (was 0.005 — too weak for 71M params)
  noise_decay: 0.998
  noise_min: 1.0e-4        # Higher floor to prevent signal death
  update_scale: 0.003      # Slightly larger ES steps
  eval_batch_size: 6       # 6 samples per perturbation (lower variance)

rollout:
  ar_frames: 3             # 3-frame temporal drift (encoder→decoder→next)
  num_inference_steps: 8   # Distilled model: fewer steps needed
  guidance_scale: 4.0      # CFG — the key addition! Produces coherent frames in AR rollout

fitness:
  w_fm_loss: 0.35
  w_latent_recon: 0.25
  w_temporal_coherence: 0.15
  w_pixel_lpips: 0.20
  w_pixel_ssim: 0.05

vae:
  use_vae_decoder: true
  vae_device: "cuda:1"

output:
  dir: "/media/2TB/omnitransfer/output/scd_evolution_cfg"
  checkpoint_every: 25
  log_every: 5
  image_log_every: 5    # Log GT vs Prediction images to W&B + save locally

wandb:
  enabled: true
  project: "scd-evolution"

seed: 42
