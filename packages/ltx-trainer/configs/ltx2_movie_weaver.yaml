# Movie Weaver Training Config
# Multi-concept video personalization with anchored prompts [R1], [R2], [R3], [R4]
#
# Key features:
# - Multiple reference images per sample (face, body, animal, etc.)
# - Concept embeddings to distinguish different identities
# - Anchored prompts linking text to reference images

acceleration:
  load_text_encoder_in_8bit: false
  mixed_precision_mode: bf16
  quantization: int8-quanto

checkpoints:
  interval: 500
  keep_last_n: 3
  precision: bfloat16

data:
  num_dataloader_workers: 2
  preprocessed_data_root: /media/2TB/movie_weaver_training

flow_matching:
  timestep_sampling_mode: shifted_logit_normal
  timestep_sampling_params: {}

hub:
  hub_model_id: null
  push_to_hub: false

lora:
  alpha: 64
  dropout: 0.0
  rank: 64
  target_modules:
    - to_q
    - to_k
    - to_v
    - to_out.0

model:
  load_checkpoint: null
  model_path: /media/2TB/ltx-models/ltx2/ltx-2-19b-dev.safetensors
  text_encoder_path: /media/2TB/ltx-models/gemma
  training_mode: lora

optimization:
  batch_size: 1
  enable_gradient_checkpointing: true
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-05
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_params: {}
  scheduler_type: cosine
  steps: 5000  # Smaller dataset, fewer steps
  weight_decay: 0.0001

output_dir: outputs/movie_weaver_stage1

seed: 42

training_strategy:
  name: omnitransfer

  # Movie Weaver specific settings
  task_type: movie_weaver
  task_types:
    - movie_weaver  # Single task for now
  multi_task_mode: false  # Single task training

  # I2V mode (reference images to video)
  i2v_mode: true
  first_frame_conditioning_p: 0.0  # Don't use first frame conditioning
  first_frame_latents_dir: null

  # Reference latents - using R1 as primary reference
  # (multi-concept refs loaded from multi_concept_refs/)
  reference_latents_dir: reference_latents_R1

  # Enable OmniTransfer components
  enable_tpb: true  # Task-aware Positional Bias
  enable_rcl: true  # Reference-decoupled Causal Learning
  enable_tma: false  # TMA optional for initial training

  # Concept embedding settings (Movie Weaver Dynamic Identity Anchoring)
  enable_concept_embeddings: true
  concept_embedding_dim: 128
  concept_embedding_num_concepts: 4  # R1, R2, R3, R4
  concept_embedding_task_specific: true
  concept_embedding_init_scale: 0.02

  # TPB settings
  tpb_max_pos:
    - 20
    - 2048
    - 2048
  tpb_theta: 10000.0

  # RCL settings
  rcl_ref_timestep: 0.0  # Clean reference condition

  # Loss weights
  target_loss_weight: 1.0
  ref_preservation_loss_weight: 0.0
  identity_loss_weight: 0.0
  lpips_weight: 0.0
  style_loss_weight: 0.0

  # Logging
  log_reconstructions: true
  reconstruction_log_interval: 100
  num_frames_to_visualize: 8
  max_samples_per_log: 4
  log_video_comparisons: true
  video_log_interval: 500
  save_reconstructions_locally: false
  local_reconstruction_dir: null

validation:
  frame_rate: 25.0
  generate_audio: false
  guidance_scale: 4.0
  images: null
  include_reference_in_output: true
  inference_steps: 30
  interval: 1000
  negative_prompt: "worst quality, blurry, distorted, identity mixing"
  prompts:
    - "A young man [R1] [R2] walking in a park on a sunny day."
  reference_videos: null
  seed: 42
  skip_initial_validation: true
  stg_blocks:
    - 29
  stg_mode: stg_av
  stg_scale: 1.0
  video_dims: !!python/tuple
    - 512
    - 512
    - 33
  videos_per_prompt: 1

wandb:
  enabled: true
  entity: null
  log_validation_videos: true
  project: movie-weaver
  tags:
    - movie_weaver
    - multi_concept
    - concept_embeddings
    - anchored_prompts
