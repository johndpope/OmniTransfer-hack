# =============================================================================
# LTX-2 Isometric I2V LoRA Training
# =============================================================================
#
# Train a LoRA adapter to animate static isometric 3D images.
# Dataset: 128 clips from 8 Grok-generated isometric videos (512x768 portrait).
# Strategy: text_to_video with first_frame_conditioning_p=1.0 (always I2V).
#
# Prerequisites:
#   1. Run encode_isometric_videos.py → latents/ + reference_latents/
#   2. Run compute_final_embeddings.py → conditions_final/
#
# Usage:
#   cd packages/ltx-trainer
#   WANDB_MODE=disabled uv run python scripts/train.py configs/ltx2_isometric_i2v.yaml
#
# =============================================================================

# Model
model:
  model_path: "/media/2TB/ltx-models/ltx2/ltx-2-19b-dev.safetensors"
  text_encoder_path: "/media/2TB/ltx-models/gemma"
  training_mode: "lora"
  load_checkpoint: null

# LoRA — moderate rank for 128 samples
lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

# Training strategy: text-to-video with always-on first frame conditioning
training_strategy:
  name: "text_to_video"
  first_frame_conditioning_p: 1.0  # Always condition on first frame (I2V mode)
  with_audio: false

# Optimization
optimization:
  learning_rate: 5e-5
  steps: 3000
  batch_size: 1
  gradient_accumulation_steps: 4   # Effective batch = 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "constant"
  scheduler_params:
    num_warmup_steps: 50
  weight_decay: 0.01
  enable_gradient_checkpointing: true

# Acceleration
acceleration:
  mixed_precision_mode: "bf16"
  quantization: "int8-quanto"
  load_text_encoder_in_8bit: true

# Hardware
hardware:
  devices:
    text_encoder: "cuda:1"
    vae_encoder: "cuda:1"
    vae_decoder: "cuda:1"
    transformer: "cuda:0"
    audio_vae: "cuda:0"
    vocoder: "cuda:0"

# Data
data:
  preprocessed_data_root: "/media/2TB/isometric_i2v_training"
  num_dataloader_workers: 2
  use_cached_final_embeddings: true
  final_embeddings_dir: "conditions_final"

# Validation — disabled (text encoder not loaded with cached final embeddings)
validation:
  prompts: []
  negative_prompt: "camera movement, blurry, distorted, static people"
  images: null
  # video_dims: [512, 768, 25]    # Low-res (512×768) — faster, lower quality
  video_dims: [768, 1152, 25]    # Hi-res (768×1152) — near-native Grok 784×1168
  frame_rate: 25.0
  seed: 42
  inference_steps: 30
  interval: null              # Disabled — no text encoder for prompt encoding
  videos_per_prompt: 1
  guidance_scale: 4.0
  stg_scale: 1.0
  stg_blocks: [29]
  stg_mode: "stg_v"
  generate_audio: false
  skip_initial_validation: true

# Checkpoints
checkpoints:
  interval: 500
  keep_last_n: 3

# Flow Matching
flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

# Hub
hub:
  push_to_hub: false
  hub_model_id: null

# Weights & Biases
wandb:
  enabled: false
  project: "isometric-i2v"
  entity: null
  tags: ["i2v", "isometric", "lora"]
  log_validation_videos: false

# General
seed: 42
output_dir: "/media/2TB/isometric_i2v_training/output"
