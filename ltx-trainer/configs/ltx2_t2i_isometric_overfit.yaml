# =============================================================================
# LTX-2 T2I LoRA Training — Isometric Frame Overfit
# =============================================================================
#
# Aggressive overfit on ~1,675 single-frame isometric samples extracted from
# 67 Grok videos (25 frames each). Continues from the T2V LoRA step 2000.
#
# Strategy: pure T2I overfit to burn the isometric 3D style into LoRA weights.
# With ~1,675 samples and 5000 steps (batch_size=1, grad_accum=4):
#   effective_batch = 4, steps_per_epoch = 1675/4 ≈ 419, epochs ≈ 12
#
# Prerequisites:
#   1. Run extract_frames_for_t2i.py → latents/ + conditions_final/
#
# Usage:
#   cd ltx-trainer
#   uv run python scripts/train.py configs/ltx2_t2i_isometric_overfit.yaml
#
# =============================================================================

# Model — continue from T2V LoRA checkpoint
model:
  model_path: "/media/2TB/ltx-models/ltx2/ltx-2-19b-dev.safetensors"
  text_encoder_path: "/media/2TB/ltx-models/gemma"
  training_mode: "lora"
  load_checkpoint: "/media/2TB/omnitransfer/output/t2v_isometric/checkpoints/lora_weights_step_02000.safetensors"

# LoRA — must match source checkpoint config
lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

# Training strategy: text-to-video (works with 1-frame latents = T2I)
training_strategy:
  name: "text_to_video"
  with_audio: false
  log_reconstructions: true
  reconstruction_log_interval: 200

# Optimization — aggressive overfit
optimization:
  learning_rate: 5.0e-4            # High LR for hard overfit
  steps: 5000                      # ~12 epochs over 1,675 samples
  batch_size: 1
  gradient_accumulation_steps: 4   # Effective batch = 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "constant"       # No decay — pure overfit
  scheduler_params: {}
  weight_decay: 0.0                # No regularization — overfit intentionally
  enable_gradient_checkpointing: true

# Acceleration
acceleration:
  mixed_precision_mode: "bf16"
  quantization: "fp8-quanto"       # Faster than int8 once JIT compiled
  load_text_encoder_in_8bit: true

# Hardware (dual GPU)
hardware:
  devices:
    text_encoder: "cuda:1"
    vae_encoder: "cuda:1"
    vae_decoder: "cuda:1"
    transformer: "cuda:0"          # RTX 5090 (32GB)
    audio_vae: "cuda:0"
    vocoder: "cuda:0"

# Data — extracted T2I frames
data:
  preprocessed_data_root: "/media/2TB/omnitransfer/data/isometric_t2i"
  num_dataloader_workers: 4        # More workers — small files, fast loading
  use_cached_final_embeddings: true
  final_embeddings_dir: "conditions_final"

# Validation — disabled (using cached embeddings, no text encoder loaded)
validation:
  prompts: []
  negative_prompt: "blurry, distorted, low quality"
  video_dims: [480, 704, 1]        # Single frame = T2I
  frame_rate: 24.0
  seed: 42
  inference_steps: 30
  interval: null
  videos_per_prompt: 1
  guidance_scale: 4.0
  stg_scale: 1.0
  stg_blocks: [29]
  stg_mode: "stg_v"
  generate_audio: false
  skip_initial_validation: true

# Checkpoints — save frequently for overfit monitoring
checkpoints:
  interval: 500
  keep_last_n: 10

# Flow Matching
flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

# Hub
hub:
  push_to_hub: false
  hub_model_id: null

# Weights & Biases
wandb:
  enabled: true
  project: "t2i-isometric-overfit"
  entity: null
  tags: ["t2i", "isometric", "grok", "overfit", "lora", "frames"]
  log_validation_videos: false

# General
seed: 42
output_dir: "/media/2TB/omnitransfer/output/t2i_isometric_overfit"
